<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#cf1034" />
  <title>AI for Government Services — Workshop Handout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="AI4ALL">
      <div class="brand-mark">AI</div>
      <div class="brand-name">AI4ALL</div>
    </div>

    <div class="course-heading">
      <h1>AI for Government Services</h1>
      <h2>Module 4: Building Intelligent AI Agents</h2>
    </div>

    <div class="save-status" id="saveStatus" aria-live="polite">
      <span class="status-dot"></span>
      <span>Saved locally</span>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Workshop sections">
      <div class="sidebar-top">
        <div class="eyebrow">YOUR HANDOUT</div>
        <div class="progress-head">
          <span>Workshop progress</span>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress-track" aria-label="Workshop progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-copy" id="progressCopy">0 of 0 required responses completed.</div>
      </div>

      <nav id="moduleNav" class="module-nav"></nav>

      <button class="reset-btn" id="resetBtn" type="button">Reset workshop</button>
    </aside>

    <main class="main-content">
      <div id="pageContent"></div>
    </main>
  </div>

  <template id="submissionTemplate">
    <section class="card submission-card">
      <div class="card-header">
        <div>
          <div class="eyebrow">COMPLETE YOUR HANDOUT</div>
          <h2>Review &amp; Submission</h2>
          <p>Create a PDF containing your answers, tables, evaluations, and uploaded evidence.</p>
        </div>
        <div class="final-badge">Final step</div>
      </div>

      <div class="completion-panel">
        <div class="completion-ring" id="completionRing"><span id="completionRingText">0%</span></div>
        <div class="completion-copy">
          <h3 id="completionTitle">Keep going</h3>
          <p id="completionMessage">Complete the required responses to unlock final submission.</p>
          <button class="primary-outline" id="reviewUnansweredBtn" type="button">Review first unanswered field</button>
        </div>
      </div>

      <div class="download-panel">
        <h3>Download and email your completed handout</h3>
        <p>Your answers and evidence are stored in this browser. Use the buttons below to print the finished handout to PDF or prepare an email.</p>
        <div class="action-row">
          <button class="primary-btn" id="printPdfBtn" type="button">Download PDF</button>
          <button class="secondary-btn" id="emailBtn" type="button">Email submission</button>
        </div>
        <div class="mini-note" id="emailNote"></div>
      </div>

      <div class="evidence-panel">
        <div class="panel-heading">
          <div>
            <div class="eyebrow">UPLOADED EVIDENCE</div>
            <h3>Your evidence files</h3>
          </div>
          <label class="upload-btn">
            Add evidence
            <input id="evidenceInput" type="file" multiple />
          </label>
        </div>
        <div id="evidenceList" class="evidence-list"></div>
      </div>
    </section>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
